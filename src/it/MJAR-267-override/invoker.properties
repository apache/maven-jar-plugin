invoker.name = MJAR-267 CLI property overrides XML configuration
invoker.description = Verifies that CLI properties override <archive><manifest> XML values in both directions: \
  property=true overrides XML=false (impl entries appear), property=false overrides XML=true (spec entries absent)
invoker.goals = clean package \
  -Dmaven.jar.manifest.addDefaultImplementationEntries=true \
  -Dmaven.jar.manifest.addDefaultSpecificationEntries=false
